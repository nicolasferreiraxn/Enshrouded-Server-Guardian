# Builds dbghelp.dll and, when the tag starts with v, publishes a release with it attached.
#
# This build log is public on purpose: it lets anyone check that the binary attached to a release
# came from this code, at this commit, without passing through anyone's machine.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Compilar
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Conferir que a DLL saiu e exporta o que o servidor pede
        shell: pwsh
        run: |
          $dll = "target/x86_64-pc-windows-msvc/release/dbghelp.dll"
          if (-not (Test-Path $dll)) { throw "dbghelp.dll nao foi gerada" }
          $tamanho = (Get-Item $dll).Length
          Write-Host "dbghelp.dll: $tamanho bytes"
          # Smaller than this means the +crt-static from .cargo/config.toml didn't apply: the DLL would
          # depend on VCRUNTIME140.dll, which doesn't exist on a server running under Wine.
          if ($tamanho -lt 250000) { throw "dbghelp.dll pequena demais ($tamanho bytes); o +crt-static provavelmente nao pegou" }
          # The server loads the DLL because of this function; without it, the DLL is useless. The name is
          # ASCII in the export table, so reading the bytes is enough - dumpbin isn't on the runner's
          # PATH, and calling a missing command aborts the whole step.
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $texto = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($texto -notmatch "MiniDumpWriteDump") { throw "a DLL nao exporta MiniDumpWriteDump" }
          Write-Host "exporta MiniDumpWriteDump: ok"

      - uses: actions/upload-artifact@v4
        with:
          name: dbghelp-dll
          path: target/x86_64-pc-windows-msvc/release/dbghelp.dll
          if-no-files-found: error

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/x86_64-pc-windows-msvc/release/dbghelp.dll
          generate_release_notes: true
          body: |
            Coloque o `dbghelp.dll` na pasta do servidor dedicado, ao lado do
            `enshrouded_server.exe`, com o servidor parado. A pasta `guardiao-dados/` aparece na
            primeira entrada de um jogador.

            Este arquivo foi compilado pelo GitHub Actions a partir deste repositório — o log do
            build é público e pode ser conferido na aba Actions.
