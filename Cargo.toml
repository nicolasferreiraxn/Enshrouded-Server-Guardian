[package]
name = "enshrouded-server-guardian"
version = "0.1.0"
edition = "2021"

[lib]
name = "dbghelp"
crate-type = ["cdylib"]

[dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
] }

[profile.release]
panic = "abort"
opt-level = 2
debug = false
